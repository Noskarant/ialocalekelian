[package]
name = "atelier-ia-kelian"
version = "1.1.0"
edition = "2021"
description = "Atelier IA local pour Kelian"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["process", "fs", "time"] }
rfd = "0.15"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png","jpeg","webp","bmp","gif","tiff"] }
lopdf = "0.38"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
calamine = "0.34"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
