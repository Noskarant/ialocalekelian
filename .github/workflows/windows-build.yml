name: Windows NSIS installer — manual / initial build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
concurrency:
  group: atelier-ia-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate UI and video worker syntax
        shell: pwsh
        run: |
          node --check src/main.js
          python -m py_compile scripts/video_worker.py
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/bootstrap.ps1), [ref]$null, [ref]$null)
      - name: Install UI dependencies
        run: npm install --no-audit --no-fund
      - name: Generate icon
        run: npx tauri icon assets/icon.svg -o src-tauri/icons
      - name: Build Windows .exe (Tauri + NSIS)
        run: npm run tauri build
      - name: Check installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $exe) { throw 'NSIS installer missing' }
          $exe | ForEach-Object { Write-Host $_.FullName $_.Length }
      - name: Store short-lived artifact (1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: Atelier-IA-Kelian-Setup-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1
          if-no-files-found: error
      - name: Publish GitHub Release (persistent public .exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          gh release view v1.1.0 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.0 $exe --clobber
          } else {
            gh release create v1.1.0 $exe --target $env:GITHUB_SHA --title 'Atelier IA Kélian v1.1.0' --notes 'Installateur Windows x64 non signé. Les modèles se téléchargent localement après installation. Validation GPU requise.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publish failed' }
# Final v1.1.0 build: use lopdf 0.38-supported PDF extraction API; no model weights in GitHub.
